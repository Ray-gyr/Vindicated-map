<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VINdicated Map</title>

    <!-- MapLibre CSS -->
   <link
    href="https://unpkg.com/maplibre-gl@6.11.0/dist/maplibre-gl.css"
    rel="stylesheet"
/>

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Lora:wght@600;700&display=swap"
    rel="stylesheet"
>
</head>

<body>

    <div id="sidebar">

        <div class="sidebar-header">

    <div class="brand">
        <img
            src="images/VINdicated Logo.png"
            alt="VINdicated logo"
            class="brand-logo"
        >

        <div class="brand-name">
            <span class="brand-vin">VIN</span><span class="brand-dicated">dicated</span>
        </div>
    </div>

    <p class="sidebar-subtitle">
        Dealership accountability map
    </p>

</div>

        <input
            type="text"
            id="search"
            placeholder="Search dealership or location..."
        >

        <div id="filters">

    <h3>Risk level</h3>

    <label class="filter-row">
        <input type="checkbox" class="tier-filter" value="clear" checked>
        <span class="legend-dot low"></span>
        <span>Clear</span>
    </label>

    <label class="filter-row">
        <input type="checkbox" class="tier-filter" value="caution" checked>
        <span class="legend-dot medium"></span>
        <span>Caution</span>
    </label>

    <label class="filter-row">
        <input type="checkbox" class="tier-filter" value="flagged" checked>
        <span class="legend-dot high"></span>
        <span>Flagged</span>
    </label>

        </div>

        <div class="results-heading">
            Dealerships
        </div>

        <div id="dealership-list"></div>

    </div>

    <div id="map"></div>

    <!-- Map JavaScript -->
    <script type="module" src="app.js"></script>

</body>

</html>
